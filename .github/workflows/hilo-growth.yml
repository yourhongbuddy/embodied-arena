name: HILO GrowthOps read-only audit
on:
  workflow_dispatch:
  schedule:
    - cron: '37 15 * * *'
  pull_request:
    paths:
      - 'tools/hilo_growth.py'
      - 'tools/test_hilo_growth.py'
      - 'tools/hilo_synthetic_preflight.py'
      - 'tools/test_hilo_synthetic_preflight.py'
      - 'tools/hilo_browser_links.py'
      - 'tools/test_hilo_browser_links.py'
      - 'tools/hilo_asset_probe.py'
      - 'tools/test_hilo_asset_probe.py'
      - 'tools/hilo_link_probe.py'
      - 'tools/test_hilo_link_probe.py'
      - 'tools/hilo_synthetic_fixture.json'
      - 'config/hilo-growth.json'
      - 'docs/HILO-GROWTH*.md'
      - 'docs/HILO-SYNTHETIC-PREFLIGHT.md'
      - 'plugins/hilo-benchmark/**'
      - '.agents/plugins/marketplace.json'
      - '.claude-plugin/marketplace.json'
      - 'distribution/**'
      - 'public/hilo/**'
      - 'public/sitemap.xml'
      - 'public/robots.txt'
      - 'app/layout.tsx'
      - 'app/site-origin.ts'
      - '.github/workflows/hilo-growth.yml'
permissions:
  contents: read
concurrency:
  group: hilo-growth-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Test queue, evidence boundaries and metadata
        run: python3 -m unittest discover -s tools -p 'test_hilo_growth.py' -v
      - name: Test synthetic-only developer telemetry preflight
        run: |
          python3 -m unittest discover -s tools -p 'test_hilo_synthetic_preflight.py' -v
          python3 tools/hilo_synthetic_preflight.py tools/hilo_synthetic_fixture.json
      - name: Test read-only browser link inventory
        run: python3 -m unittest discover -s tools -p 'test_hilo_browser_links.py' -v
      - name: Test bounded public static-asset checks
        run: python3 -m unittest discover -s tools -p 'test_hilo_asset_probe.py' -v
      - name: Test bounded public WANTED documentation-link checks
        run: python3 -m unittest discover -s tools -p 'test_hilo_link_probe.py' -v
      - name: Execute bounded read-only audits, not paid model agents
        run: python3 tools/hilo_growth.py run --online --cycle "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Render static developer page without a web service
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$chrome" ]; then
            timeout 30 "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --window-size=1440,1100 --screenshot="$PWD/artifacts/hilo-growth/developer-preview.png" "file://$PWD/public/hilo/developers.html"
          else
            printf 'Browser unavailable; visual test not performed.\n' > artifacts/hilo-growth/browser-status.txt
          fi
      - name: Independently render public WANTED and inventory known link statuses
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p artifacts/hilo-growth
          chrome="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            printf 'public_browser_unavailable\n' > artifacts/hilo-growth/public-browser-status.txt
          elif timeout 35 "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-extensions --window-size=1440,1100 --virtual-time-budget=5000 --dump-dom "https://getrobotrouter.com/wanted-10k" > artifacts/hilo-growth/public-wanted-dom.html 2> artifacts/hilo-growth/public-browser-stderr.txt; then
            if grep -q 'WANTED' artifacts/hilo-growth/public-wanted-dom.html; then
              printf 'public_browser_DOM_observed_no_asset_success_claim\n' > artifacts/hilo-growth/public-browser-status.txt
              python3 tools/hilo_browser_links.py --html artifacts/hilo-growth/public-wanted-dom.html --report artifacts/hilo-growth/report.json --output artifacts/hilo-growth/public-browser-links.json
              python3 tools/hilo_asset_probe.py --inventory artifacts/hilo-growth/public-browser-links.json --output artifacts/hilo-growth/public-static-assets.json
              python3 tools/hilo_link_probe.py --inventory artifacts/hilo-growth/public-browser-links.json --output artifacts/hilo-growth/public-document-links.json
            else
              printf 'public_browser_DOM_does_not_establish_WANTED_render\n' > artifacts/hilo-growth/public-browser-status.txt
            fi
          else
            printf 'public_browser_render_failed_not_global_outage_evidence\n' > artifacts/hilo-growth/public-browser-status.txt
          fi
      - name: Preserve actual evidence and source bundle
        if: always()
        run: |
          mkdir -p artifacts/hilo-growth
          git diff --name-only HEAD^ HEAD > artifacts/hilo-growth/last-commit-paths.txt || true
          git rev-parse HEAD > artifacts/hilo-growth/source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hilo-growth-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/hilo-growth/
          retention-days: 14
