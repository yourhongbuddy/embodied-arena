name: HILO data-engine checks and daily plan
on:
  workflow_dispatch:
  push:
    branches: [digitalocean]
    paths:
      - '.github/workflows/hilo-data-engine.yml'
      - 'config/hilo-data-engine.json'
      - 'tools/hilo_data_engine.py'
      - 'tools/test_hilo*.py'
      - 'docs/HILO-DATA-ENGINE*.md'
  schedule:
    - cron: '17 15 * * *'
  pull_request:
    paths:
      - 'tools/hilo_data_engine.py'
      - 'tools/test_hilo*.py'
      - 'config/hilo-data-engine.json'
      - 'schemas/hilo-collection-episode.schema.json'
      - 'public/wanted-10k/data-engine.html'
      - 'docs/HILO-DATA-ENGINE*.md'
      - '.github/workflows/hilo-data-engine.yml'
permissions:
  contents: read
concurrency:
  group: hilo-data-engine-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-and-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline validation
        run: python -m unittest discover -s tools -p 'test_hilo*.py' -v
      - name: Produce explicit offline plan
        run: python tools/hilo_data_engine.py plan
      - name: Check live execution configuration without exposing secrets
        if: github.event_name != 'pull_request'
        env:
          HILO_ENABLE_LIVE: ${{ vars.HILO_ENABLE_LIVE }}
          OPENAI_MODEL: ${{ vars.HILO_OPENAI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.HILO_OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          enabled = os.environ.get("HILO_ENABLE_LIVE") == "1"
          checks = {
              "HILO_ENABLE_LIVE=1": enabled,
              "HILO_OPENAI_MODEL": bool(os.environ.get("OPENAI_MODEL", "").strip()),
              "HILO_OPENAI_API_KEY": bool(os.environ.get("OPENAI_API_KEY", "").strip()),
          }
          missing = []
          if enabled:
              missing = [name for name in ("HILO_OPENAI_MODEL", "HILO_OPENAI_API_KEY") if not checks[name]]
          if not enabled:
              status = "live_disabled"
          elif missing:
              status = "blocked_missing_configuration"
          else:
              status = "ready_for_live_attempt"
          report = {
              "checked_at": datetime.now(timezone.utc).isoformat(),
              "status": status,
              "checks": checks,
              "missing": missing,
              "live_started": 0,
              "live_completed": 0,
              "credential_values_recorded": False,
          }
          output = Path("artifacts/hilo-data-engine") / datetime.now(timezone.utc).date().isoformat()
          output.mkdir(parents=True, exist_ok=True)
          (output / "execution-preflight.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as stream:
                  stream.write("## HILO live execution preflight\n\n")
                  stream.write("Status: **" + status + "**\n\n")
                  stream.write("No model requests are made by this check.\n\n")
                  if status == "live_disabled":
                      stream.write("Live workers remain intentionally disabled; offline validation and planning still run.\n")
                  elif missing:
                      stream.write("Live execution was requested but required configuration is unavailable: " + ", ".join(missing) + ".\n")
          print(json.dumps(report, indent=2))
          if enabled and missing:
              raise SystemExit("Live workers not started: live execution was enabled but required configuration is missing.")
          PY
      - name: Run approved live workers
        if: github.event_name != 'pull_request' && vars.HILO_ENABLE_LIVE == '1'
        env:
          HILO_ENABLE_LIVE: '1'
          OPENAI_MODEL: ${{ vars.HILO_OPENAI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.HILO_OPENAI_API_KEY }}
        run: python tools/hilo_data_engine.py run
      - name: Retain execution evidence, including failed runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hilo-data-engine-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/hilo-data-engine/
          retention-days: 30
