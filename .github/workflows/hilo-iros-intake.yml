name: HILO IROS public-directory intake
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hilo-iros-intake.yml'
      - 'tools/hilo_iros*.py'
      - 'data/conferences/iros-2026/**'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Collect bounded public source snapshots and repository context
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,re,shutil,subprocess,tempfile,urllib.request,urllib.error,urllib.parse,urllib.robotparser,time
          from datetime import datetime,timezone
          out=pathlib.Path('artifacts/iros-intake');out.mkdir(parents=True,exist_ok=True)
          sources={
            'paper-explorer':'https://gisbi-kim.github.io/iros2026-explorer/output/iros2026_explorer.html',
            'explorer-parser':'https://raw.githubusercontent.com/gisbi-kim/iros2026-explorer/main/scripts/parse_iros_index.py',
            'exhibitor-portal':'https://iros.exhibitprospectus.com/',
            'floorplan':'https://hallerickson.ungerboeck.com/prod/app85.cshtml?aat=476536577156495637675968556c4f314c492f76754b5257434e747373646c334968316d386978777138553d',
            'touch-to-action':'https://iros-touch2action.github.io/',
            'human-robot-dialogue':'https://human-robot-dialogue.github.io/',
            'human-aware-ai':'https://heai-iros26-workshop.github.io/',
            'compositional':'https://compositional-robotics.github.io/',
            'physical-world-models':'https://physical-world-models.github.io/IROS2026/',
            'formal-methods':'https://lafr-workshop.github.io/',
            'robot-teammates':'https://ontoagenticai26.info/',
            'self-driving-labs':'https://sites.tufts.edu/selfdrivinglabs-iros2026/'
          }
          ua='HILO-Conference-Directory/0.1';report=[];robots={}
          for ident,url in sources.items():
            row={'id':ident,'url':url,'retrieved_at':datetime.now(timezone.utc).isoformat(),'published_on':None}
            try:
              base=urllib.parse.urlsplit(url);origin=base.scheme+'://'+base.netloc
              if origin not in robots:
                rp=urllib.robotparser.RobotFileParser();rp.set_url(origin+'/robots.txt')
                try:
                  r=urllib.request.urlopen(urllib.request.Request(origin+'/robots.txt',headers={'User-Agent':ua}),timeout=12)
                  rp.parse(r.read(100000).decode('utf-8','replace').splitlines());robots[origin]=rp
                except urllib.error.HTTPError as e:
                  if e.code==404: rp.parse([]);robots[origin]=rp
                  else: raise
              if not robots[origin].can_fetch(ua,url):
                row['status']='robots_disallowed';report.append(row);continue
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept-Encoding':'identity'})
              with urllib.request.urlopen(req,timeout=25) as r:
                data=r.read(16000001)
                if len(data)>16000000: raise ValueError('source_size_limit')
                row.update(status='retrieved',http_status=r.status,sha256=hashlib.sha256(data).hexdigest(),bytes=len(data),final_url=r.geturl())
                # Only publicly served sources. Do not follow forms, logins, attendee databases or mail links.
                text=data.decode('utf-8','replace')
                text=re.sub(r'[A-Za-z0-9.!#$%&\'*+/=?^_`{|}~-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}', '[email-redacted]',text)
                (out/(ident+'.txt')).write_text(text,encoding='utf-8')
              time.sleep(.5)
            except Exception as e: row.update(status='unavailable',error_type=type(e).__name__)
            report.append(row)
          (out/'retrieval.json').write_text(json.dumps(report,indent=2)+'\n')
          files=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          (out/'repository-paths.txt').write_text('\n'.join(files))
          for path in files:
            if (path.startswith(('config/','data/','docs/HILO','marketing/HILO','app/atlas/','app/campaigns/')) or path in ('docs/RELEASE-CHECKLIST.md','tools/hilo_growth.py')) and pathlib.Path(path).stat().st_size<2000000:
              dest=out/'repository'/path;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(path,dest)
          chrome=shutil.which('google-chrome') or shutil.which('chromium')
          if chrome and any(r['id']=='floorplan' and r['status']=='retrieved' for r in report):
            with tempfile.TemporaryDirectory() as p:
              command=[chrome,'--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--user-data-dir='+p,'--virtual-time-budget=15000','--dump-dom',sources['floorplan']]
              try:
                result=subprocess.run(command,capture_output=True,timeout=45)
                text=result.stdout.decode('utf-8','replace')
                text=re.sub(r'[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}','[email-redacted]',text)
                (out/'floorplan-rendered.html').write_text(text)
              except subprocess.TimeoutExpired: pass
          print(json.dumps([{'id':r['id'],'status':r['status'],'bytes':r.get('bytes')} for r in report],indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hilo-iros-intake-${{ github.run_id }}
          path: artifacts/iros-intake/
          retention-days: 7
