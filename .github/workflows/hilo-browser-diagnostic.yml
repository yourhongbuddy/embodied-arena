name: HILO read-only browser and asset diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hilo-browser-diagnostic.yml'
permissions: {}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public assets and browser rendering with installed Chrome
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, datetime, html.parser, json, re, shutil, subprocess, tempfile, urllib.error, urllib.parse, urllib.request
          from pathlib import Path
          Path('diagnostics').mkdir(exist_ok=True)
          pages = [
              ('main', 'https://getrobotrouter.com/wanted-10k'),
              ('data-engine', 'https://getrobotrouter.com/wanted-10k/data-engine.html'),
              ('sites', 'https://embodied-arena.chrishongap.chatgpt.site/wanted-10k'),
          ]
          def fetch(url, limit=512):
              result = {'url': url}
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 HILO-Availability-Diagnostic/1.0', 'Accept-Encoding': 'identity'})
                  try:
                      response = urllib.request.urlopen(request, timeout=12)
                  except urllib.error.HTTPError as error:
                      response = error
                  with response:
                      result.update(status=response.code, final_url=response.geturl(), content_type=response.headers.get('Content-Type'))
                      result['body'] = response.read(limit).decode('utf-8', 'replace')
              except Exception as error:
                  result.update(error=str(error), error_type=type(error).__name__)
              return result
          class TextParser(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__(); self.skip=0; self.text=[]
              def handle_starttag(self, tag, attrs):
                  if tag in ('script','style'): self.skip+=1
              def handle_endtag(self, tag):
                  if tag in ('script','style'): self.skip=max(0,self.skip-1)
              def handle_data(self, text):
                  if not self.skip and text.strip(): self.text.append(text.strip())
          report = {'checked_at': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'production_modified': False, 'model_requests': 0, 'pages': [], 'browser_checks': [], 'note': 'One runner vantage. Browser snapshots do not establish every interaction or historical/regional availability.'}
          chrome = shutil.which('google-chrome') or shutil.which('google-chrome-stable') or shutil.which('chromium') or shutil.which('chromium-browser')
          report['browser_binary'] = chrome
          for name, url in pages:
              page = fetch(url, 262144)
              markup = page.pop('body', '')
              page['title'] = re.findall(r'<title[^>]*>(.*?)</title>', markup, re.I | re.S)[:1]
              paths = sorted(set(re.findall(r'(?:src|href)="(/_next/static/[^"<>]+)"', markup)))[:100]
              assets = [urllib.parse.urljoin(url, path) for path in paths]
              with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
                  checks = list(pool.map(fetch, assets))
              for check in checks:
                  check.pop('body', None)
              page['asset_count'] = len(assets)
              page['asset_failures'] = [x for x in checks if x.get('status') != 200 or 'text/html' in (x.get('content_type') or '')]
              page['assets'] = checks
              report['pages'].append(page)
              if not chrome:
                  report['browser_checks'].append({'url': url, 'status': 'browser_unavailable'})
                  continue
              with tempfile.TemporaryDirectory() as profile:
                  command = [chrome, '--headless=new', '--no-sandbox', '--disable-dev-shm-usage', '--disable-gpu', '--no-first-run', '--no-default-browser-check', '--disable-background-networking', '--user-data-dir='+profile, '--virtual-time-budget=7000', '--window-size=1440,1000', '--screenshot='+str(Path('diagnostics',name+'.png').resolve()), '--dump-dom', url]
                  try:
                      result = subprocess.run(command, capture_output=True, timeout=30)
                      dom = result.stdout.decode('utf-8','replace')
                      Path('diagnostics',name+'-rendered.html').write_text(dom,encoding='utf-8')
                      parser = TextParser(); parser.feed(dom)
                      text = '\n'.join(parser.text)
                      browser = {'url': url, 'exit_code': result.returncode, 'dom_bytes': len(result.stdout), 'text_excerpt': text[:2500], 'error_markers': [word for word in ['Application error','This site can\u2019t be reached','ERR_NAME_NOT_RESOLVED','Internal Server Error','502 Bad Gateway'] if word in text], 'screenshot_written': Path('diagnostics',name+'.png').exists()}
                      Path('diagnostics',name+'-chrome.log').write_text(result.stderr.decode('utf-8','replace'),encoding='utf-8')
                  except subprocess.TimeoutExpired:
                      browser = {'url': url, 'status': 'browser_timeout', 'screenshot_written': Path('diagnostics',name+'.png').exists()}
                  report['browser_checks'].append(browser)
          Path('diagnostics/browser-assets.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2))
          PY
      - name: Retain browser and asset evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hilo-browser-diagnostic-${{ github.run_id }}
          path: diagnostics/
          retention-days: 7
