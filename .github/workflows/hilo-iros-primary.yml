name: HILO IROS policy-gated primary source check
on:
  pull_request:
    paths: ['tools/hilo_iros_primary.py', '.github/workflows/hilo-iros-primary.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 tools/hilo_iros_primary.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hilo-iros-primary-${{ github.run_id }}
          path: artifacts/iros-primary/
          retention-days: 7
